name: Deploy AeroLab CFD to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s README.md
          grep -q 'id="viewer"' index.html
          grep -q 'href="styles.css"' index.html
          grep -q 'src="app.js"' index.html
      - name: Validate Python engine syntax
        run: python -m py_compile local-engine/server.py local-engine/solver.py
      - name: Validate browser JavaScript syntax
        run: node --input-type=module --check < app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
